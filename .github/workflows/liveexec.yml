name: Build LiveExec32 and Extract Ramdisk DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout LiveExec32
        uses: actions/checkout@v4
        with:
          repository: LiveContainer/LiveExec32

      - name: Install wget and unzip
        run: brew install wget unzip

      - name: Install ipsw binary from latest release
        run: |
          # Obtener URL del asset para macOS arm64 (si existe) o x86_64
          IPSW_URL=$(curl -s https://api.github.com/repos/blacktop/ipsw/releases/latest | grep -o 'https://github.com/blacktop/ipsw/releases/download/.*/ipsw_.*_macOS_arm64.zip' | head -1)
          if [ -z "$IPSW_URL" ]; then
            echo "No se encontró asset para arm64, intentando con x86_64"
            IPSW_URL=$(curl -s https://api.github.com/repos/blacktop/ipsw/releases/latest | grep -o 'https://github.com/blacktop/ipsw/releases/download/.*/ipsw_.*_macOS_x86_64.zip' | head -1)
          fi
          if [ -z "$IPSW_URL" ]; then
            echo "Error: No se pudo obtener la URL de ipsw"
            exit 1
          fi
          echo "Descargando desde: $IPSW_URL"
          curl -L -o ipsw.zip "$IPSW_URL"
          mkdir -p ipsw_extract
          unzip ipsw.zip -d ipsw_extract
          # Buscar el binario (puede estar en subcarpetas)
          find ipsw_extract -type f -name "ipsw" -exec cp {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/ipsw
          ipsw --version

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: 'theos'
          theos-src: 'https://github.com/theos/theos'

      - name: Build LiveExec32
        run: |
          export THEOS=./theos
          make
          mkdir -p output
          cp .theos/out/LiveExec32 output/

      - name: Download IPSW (iOS 10.3.3 for iPhone 5)
        run: |
          IPSW_URL="http://appldnld.apple.com/ios10.3.3/091-23384-20170719-CA966D80-6977-11E7-9F96-3E9100BA0AE3/iPhone_4.0_32bit_10.3.3_14G60_Restore.ipsw"
          wget -O iPhone_4.0_32bit_10.3.3_14G60_Restore.ipsw "$IPSW_URL"

      - name: Extract Filesystem DMG
        run: |
          ipsw extract iPhone_4.0_32bit_10.3.3_14G60_Restore.ipsw --dmg
          # Renombrar el archivo .dmg generado (puede tener nombre variable)
          mv *.dmg ramdisk.dmg 2>/dev/null || true

      - name: Package Artifact
        run: |
          mkdir -p artifact
          cp output/LiveExec32 artifact/
          cp ramdisk.dmg artifact/
          cd artifact && zip -r ../LiveExec32_bundle.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveExec32-bundle
          path: LiveExec32_bundle.zip