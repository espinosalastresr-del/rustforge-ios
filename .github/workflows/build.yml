name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Nombre del proyecto"
        required: true
        type: string
        default: "DemoApp"
      artifact_url:
        description: "URL del zip con sources + staticlib (opcional si se usa template interno)"
        required: false
        type: string
        default: ""
      use_template:
        description: "Usar plantilla hybrid interna (smoke test)"
        required: false
        type: boolean
        default: true

env:
  IOS_DEPLOYMENT_TARGET: "17.0"

jobs:
  build:
    name: Link + Package IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d /Applications/Xcode_16.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          elif [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-ios-${{ runner.os }}-

      - name: Prepare project sources
        run: |
          set -euo pipefail
          mkdir -p build/input/project build/output

          if [ -n "${{ github.event.inputs.artifact_url }}" ]; then
            echo "Downloading user artifact..."
            curl -fsSL "${{ github.event.inputs.artifact_url }}" -o build/input/project.zip
            unzip -o build/input/project.zip -d build/input/project
          elif [ "${{ github.event.inputs.use_template }}" = "true" ]; then
            echo "Using internal hybrid template..."
            PROJ="build/input/project"
            mkdir -p "$PROJ/src" "$PROJ/ios"

            cat > "$PROJ/Cargo.toml" << 'EOF'
          [package]
          name = "demo_logic"
          version = "0.1.0"
          edition = "2021"

          [lib]
          crate-type = ["staticlib"]

          [dependencies]
          EOF

            cat > "$PROJ/src/lib.rs" << 'EOF'
          #[no_mangle]
          pub extern "C" fn rustforge_add(a: i32, b: i32) -> i32 {
              a + b
          }

          #[no_mangle]
          pub extern "C" fn rustforge_version() -> i32 {
              1
          }
          EOF

            cat > "$PROJ/ios/ContentView.swift" << 'EOF'
          import SwiftUI

          struct ContentView: View {
              var body: some View {
                  VStack(spacing: 16) {
                      Text("RustForge Demo")
                          .font(.title.bold())
                      Text("Rust + SwiftUI hybrid")
                          .foregroundStyle(.secondary)
                      Text("2 + 3 = \(rustforge_add(2, 3))")
                          .font(.title2.monospaced())
                  }
                  .padding()
              }
          }
          EOF

            cat > "$PROJ/ios/App.swift" << 'EOF'
          import SwiftUI

          @main
          struct DemoApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

            cat > "$PROJ/ios/bridging.h" << 'EOF'
          #ifndef bridging_h
          #define bridging_h
          #include <stdint.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          int32_t rustforge_add(int32_t a, int32_t b);
          int32_t rustforge_version(void);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF
          else
            echo "ERROR: provide artifact_url or enable use_template"
            exit 1
          fi

          echo "Project tree:"
          find build/input/project -type f | head -50

      - name: Build Rust staticlib
        working-directory: build/input/project
        run: |
          set -euo pipefail
          if [ -f Cargo.toml ]; then
            cargo build --release --target aarch64-apple-ios
            LIB=$(find target/aarch64-apple-ios/release -name "lib*.a" | head -1)
            echo "Built: $LIB"
            mkdir -p ../libs
            cp "$LIB" ../libs/
            ls -la ../libs/
          else
            echo "No Cargo.toml — skipping Rust build"
          fi

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen

          PROJ="build/input/project"
          APP_NAME="${{ github.event.inputs.project_name }}"
          LIB_NAME=$(ls build/input/libs/lib*.a 2>/dev/null | head -1 | xargs -I{} basename {} .a | sed 's/^lib//')
          LIB_NAME=${LIB_NAME:-demo_logic}

          # Collect Swift sources
          mkdir -p build/xcode/Sources
          if [ -d "$PROJ/ios" ]; then
            cp -R "$PROJ/ios/"* build/xcode/Sources/ 2>/dev/null || true
          fi
          find "$PROJ" -name "*.swift" ! -path "*/ios/*" -exec cp {} build/xcode/Sources/ \; 2>/dev/null || true

          # Ensure we have at least App entry
          if [ ! -f build/xcode/Sources/App.swift ]; then
            cat > build/xcode/Sources/App.swift << EOF
          import SwiftUI
          @main
          struct ${APP_NAME}App: App {
              var body: some Scene {
                  WindowGroup { Text("${APP_NAME}") }
              }
          }
          EOF
          fi

          # Bridging header
          if [ -f "$PROJ/ios/bridging.h" ]; then
            cp "$PROJ/ios/bridging.h" build/xcode/Sources/Bridging-Header.h
          else
            cat > build/xcode/Sources/Bridging-Header.h << 'EOF'
          #ifndef Bridging_Header_h
          #define Bridging_Header_h
          #include <stdint.h>
          int32_t rustforge_add(int32_t a, int32_t b);
          int32_t rustforge_version(void);
          #endif
          EOF
          fi

          # Info.plist
          cat > build/xcode/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>\$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>com.rustforge.\$(PRODUCT_NAME:rfc1034identifier)</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>\$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
            <key>MinimumOSVersion</key><string>17.0</string>
          </dict>
          </plist>
          EOF

          cat > build/xcode/project.yml << EOF
          name: ${APP_NAME}
          options:
            bundleIdPrefix: com.rustforge
            deploymentTarget:
              iOS: "17.0"
            xcodeVersion: "16.0"
          settings:
            base:
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1,2"
              CODE_SIGNING_ALLOWED: NO
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: NO
          targets:
            ${APP_NAME}:
              type: application
              platform: iOS
              sources:
                - path: Sources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.rustforge.${APP_NAME}
                  INFOPLIST_FILE: Info.plist
                  SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging-Header.h
                  LIBRARY_SEARCH_PATHS: "\$(SRCROOT)/../input/libs"
                  OTHER_LDFLAGS: "-l${LIB_NAME}"
                  ENABLE_BITCODE: NO
                  VALIDATE_PRODUCT: NO
          EOF

          cd build/xcode && xcodegen generate
          ls -la

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          APP_NAME="${{ github.event.inputs.project_name }}"
          mkdir -p build/DerivedData
          xcodebuild \
            -project "build/xcode/${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/output/xcodebuild.log

      - name: Package .ipa (unsigned, LiveContainer-ready)
        run: |
          set -euo pipefail
          APP_NAME="${{ github.event.inputs.project_name }}"
          APP_PATH=$(find build/DerivedData -name "${APP_NAME}.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            find build/DerivedData -name "*.app" -type d || true
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p build/output/Payload
          cp -R "$APP_PATH" build/output/Payload/
          cd build/output
          zip -r "${APP_NAME}.ipa" Payload
          ls -lah "${APP_NAME}.ipa"
          # Also keep the raw .app
          cp -R "$APP_PATH" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-${{ github.event.inputs.project_name }}
          path: |
            build/output/*.ipa
            build/output/*.app
            build/output/xcodebuild.log
          retention-days: 7
