name: RustForge
options:
  bundleIdPrefix: com.rustforge
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES: YES

targets:
  RustForge:
    type: application
    platform: iOS
    sources:
      - path: app/RustForgeApp
        excludes:
          - Info.plist
      - path: runtime
        excludes:
          - wamr/lib/**
          - "**/*.md"
      - path: cargo
      - path: analyzer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rustforge.ios
        PRODUCT_NAME: RustForge
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "NO"
        INFOPLIST_FILE: app/RustForgeApp/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: app/RustForgeApp/RustForge-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/runtime/wamr
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/runtime/wamr/lib
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: RustForge
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
    info:
      path: app/RustForgeApp/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSDocumentsFolderUsageDescription: "RustForge necesita acceso a documentos para proyectos y SDKs."
